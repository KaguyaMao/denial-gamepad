# Dedicated output profile for the Denial Mobile SDDM entry.
# Mirrors the current KDE eDP-1 setup: native 1600x2560 at 144 Hz, rotated to
# logical landscape, with scale 2.25 (about 1138x712 logical pixels).
# This file is isolated from denial-outputs.conf and does not alter other
# Denial session profiles.
primary=eDP-1
eDP-1=0,0
mode=eDP-1,1600,2560,144000
scale=eDP-1,2.25
transform=eDP-1,90
